[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mbuc-reference-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "corporate-security-resilience==1.0.0",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/reference_api"]
