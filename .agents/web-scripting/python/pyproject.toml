[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "corporate-security-resilience"
version = "1.0.0"
description = "Interoperable AES-256-GCM and resilient HTTP client"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_security"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
