<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>MBUC WebCrypto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Envelope AES-256-GCM</h1>
    <p>Esta página usa uma chave efêmera local e não envia dados à rede.</p>
    <form id="crypto-form">
      <label>Texto<textarea id="plaintext" required maxlength="4096"></textarea></label>
      <label>Contexto AAD<input id="aad" required maxlength="256" value="tenant:local|purpose:demo"></label>
      <button type="submit">Criptografar e validar</button>
    </form>
    <output id="result" aria-live="polite"></output>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
